name: Nix tooling CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-tooling-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: python3 scripts/ci/contract.py metadata
      - id: select
        run: python3 scripts/ci/contract.py select
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: actionlint@1.7.7
      - run: actionlint
  nix-eval:
    uses: rybskiworks/.github/.github/workflows/reusable-nix-check.yml@3a7ef7dd7d23aedba866cb3a3a5df26ff2f86a7c
    with:
      tier: evaluate
  nix-full:
    needs: policy
    if: needs.policy.outputs.full == 'true'
    uses: rybskiworks/.github/.github/workflows/reusable-nix-check.yml@3a7ef7dd7d23aedba866cb3a3a5df26ff2f86a7c
    with:
      tier: full
  required:
    name: CI / required
    needs: [policy, nix-eval, nix-full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/contract.py gate
